<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생활ZIP 건강보험료 간편 계산기</title><style>body{font-family:system-ui,sans-serif;background:#f5f6f8;margin:0;padding:20px;color:#202124}.wrap{max-width:560px;margin:auto;background:white;border-radius:18px;padding:26px;box-shadow:0 4px 20px #0001}h1{font-size:24px}label{display:block;font-weight:700;margin:18px 0 7px}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px}button{background:#16754b;color:white;border:0;border-radius:9px;padding:14px;width:100%;font-size:17px;font-weight:700;margin-top:22px;cursor:pointer}.result{background:#eef7f2;padding:18px;border-radius:12px;margin-top:20px}small,p.note{color:#666;line-height:1.65}strong.sum{font-size:27px;color:#176443}</style></head><body><main class="wrap"><h1>😊 생활ZIP 건강보험료 간편 계산기</h1><p>2026년 요율로 소득분 보험료를 대략 계산해요.</p><label for="income">연간 소득 (만원)</label><input id="income" type="number" min="0" value="2000"><label for="kind">소득 종류</label><select id="kind"><option value="1">사업·금융소득 등 (100% 반영 가정)</option><option value="0.5">공적연금·근로소득 (50% 반영 가정)</option></select><label for="property">월 재산보험료 (원, 모르면 0)</label><input id="property" type="number" min="0" value="0"><button onclick="calculate()">예상 보험료 계산하기</button><div class="result" aria-live="polite"><div>월 예상 납부액</div><strong class="sum" id="total">-</strong><p id="detail"></p></div><p class="note"><small>※ 교육용 간편 추정입니다. 소득 종류별 실제 반영 방식, 재산점수, 최저보험료, 절사 및 정산 규정 등에 따라 실제 고지액과 차이가 있습니다. 사업·금융소득은 합산 및 과세 기준이 다를 수 있습니다. 임의계속가입·피부양자 여부는 계산하지 않습니다. 개인정보는 서버로 전송하지 않습니다.</small></p><p><a href="https://www.nhis.or.kr" target="_blank" rel="noopener noreferrer">국민건강보험공단에서 정확한 보험료 확인하기 ↗</a></p></main><script>function calculate(){const income=Number(document.getElementById('income').value),property=Number(document.getElementById('property').value),factor=Number(document.getElementById('kind').value);if(!Number.isFinite(income)||!Number.isFinite(property)||income<0||property<0){alert('0 이상의 숫자를 입력해 주세요.');return;}const health=Math.max(20160,income*10000*factor/12*0.0719+property),care=health*0.1314,total=health+care;const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';document.getElementById('total').textContent=fmt(total);document.getElementById('detail').textContent='건강보험료 약 '+fmt(health)+' + 장기요양보험료 약 '+fmt(care);}calculate();</script></body></html>
